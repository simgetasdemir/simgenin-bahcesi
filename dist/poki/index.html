<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script>window.__PLATFORM='poki'</script>
<style>body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>

<title>Simge'nin Bahçesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: tek sütun oyun kabı; üstte bahçe sahnesi, altta görevler. Bulmaca ekranı aynı kabın yerini alır. */
:root{
  --bg:#eaf4e4;          /* çimen sisi */
  --ink:#2c2a3d;         /* gece moru mürekkep */
  --card:#fffdf6;        /* kâğıt */
  --leaf:#2f7d4a;        /* zeytin yaprağı */
  --rose:#e2457a;        /* begonvil */
  --sun:#f6b93b;         /* limon */
  --soil:#5b4636;        /* toprak çerçeve */
  --muted:#6b6f63;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--leaf);flex:1;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.pill{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 2px 0 rgba(44,42,61,.12);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.pill .st{color:var(--sun);font-size:18px;line-height:1}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:0 2px 0 rgba(44,42,61,.12);font-weight:800}

/* Bahçe */
.scene-wrap{border-radius:22px;overflow:hidden;background:#9fd8ee;box-shadow:0 4px 0 rgba(44,42,61,.15);position:relative}
#scene{display:block;width:100%;height:auto}
#scene .lay{transition:opacity .8s ease}
#scene .off{opacity:0;pointer-events:none}
.marker{cursor:pointer}
.marker circle{fill:var(--rose);stroke:#fff;stroke-width:2.5}
.marker text{fill:#fff;font:800 14px var(--display);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.marker.locked circle{fill:#9a98a6}
.marker .ring{fill:none;stroke:var(--rose);stroke-width:2;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{r:11;opacity:.9}to{r:22;opacity:0}}
.water-drip{animation:drip 1.4s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.bulb{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.55}}
.sparkle{animation:spark .9s ease-out forwards}
@keyframes spark{from{opacity:1;transform:scale(.2)}to{opacity:0;transform:scale(1.6)}}

.panel{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 rgba(44,42,61,.1)}
.big{width:100%;background:linear-gradient(#ff8db3,var(--rose));color:#fff;font-family:var(--display);font-weight:800;font-size:22px;padding:12px;border-radius:18px;box-shadow:0 5px 0 #a82a58;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a82a58}
.big small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.9}
.panel h3{margin:0;font-family:var(--display);font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
#tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:14px;background:#f1f6ea}
.task .ti{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.task .tn{flex:1;min-width:0;font-weight:800;line-height:1.2}
.task .tn small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.do{background:var(--leaf);color:#fff;font-weight:800;border-radius:12px;padding:8px 12px;white-space:nowrap;box-shadow:0 3px 0 #1d5531}
.do[disabled]{background:#c9cbc2;box-shadow:0 3px 0 #a3a59c;cursor:default}
.prog{height:8px;border-radius:99px;background:#e4ead9;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#8fcf5c);border-radius:99px;transition:width .6s}

/* Bulmaca */
.hud{display:flex;gap:8px;align-items:stretch}
.hud .back{background:var(--card);border-radius:14px;padding:0 12px;font-weight:800;box-shadow:0 2px 0 rgba(44,42,61,.12)}
.goals{flex:1;display:flex;gap:6px;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:6px 8px;align-items:center;box-shadow:0 2px 0 rgba(44,42,61,.12);min-width:0}
.goal{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.goal .mini{width:26px;height:26px;position:relative}
.goal.ok{color:var(--leaf)}
.goal.ok b::after{content:" ✓"}
.moves{background:var(--ink);color:#fff;border-radius:14px;padding:4px 12px;text-align:center;min-width:64px}
.moves b{display:block;font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.moves small{font-size:11px;font-weight:700;opacity:.8}
.lvl-title{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);text-align:center;margin:-4px 0 -6px}
.board{position:relative;--bw:min(calc(100vw - 10px),calc(100vh - 92px));--bw:min(calc(100vw - 10px),calc(100dvh - 92px));width:var(--bw);aspect-ratio:1;margin-left:calc(50% - var(--bw) / 2);
  background:var(--soil);border-radius:20px;padding:6px;box-shadow:0 5px 0 #3d2e23}
.layer{position:absolute;inset:6px}
.cells{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:14px;overflow:hidden}
.cell{background:#6a4f3d;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cell:nth-child(odd){background:#7a5d48}
.cell.w1{background:radial-gradient(circle at 30% 70%,#5aa04a 0 18%,transparent 19%),radial-gradient(circle at 75% 30%,#4f9440 0 16%,transparent 17%),#3f7a37}
.cell.w2{background:radial-gradient(circle at 30% 70%,#2f6b2a 0 18%,transparent 19%),radial-gradient(circle at 75% 30%,#2f6b2a 0 16%,transparent 17%),#22521f;box-shadow:inset 0 0 0 2px #163a14}
.tiles{overflow:hidden;border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.tile{position:absolute;width:12.5%;height:12.5%;transition:left .16s ease,top .24s cubic-bezier(.55,.05,.85,.5);will-change:top,left}
.tile.pop .gem{transform:scale(0) rotate(40deg);opacity:0}
.gem{position:absolute;inset:2.5%;border-radius:30%;display:grid;place-items:center;transition:transform .2s ease,opacity .2s ease;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.45),0 2px 3px rgba(0,0,0,.3);overflow:hidden}
.gem svg{width:86%;height:86%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.22));position:relative;z-index:1}
.gem.g0,.gem.g1,.gem.g2,.gem.g3,.gem.g4{background:none;box-shadow:none;overflow:visible}
.gem.g0 svg,.gem.g1 svg,.gem.g2 svg,.gem.g3 svg,.gem.g4 svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.g0{--c:#ff2d4d}.g1{--c:#22c03a}.g2{--c:#1e7bff}.g3{--c:#ffc400}.g4{--c:#9b3df0}
.gem.sp-h,.gem.sp-v,.gem.sp-b{background:rgba(255,255,255,.4);border-radius:30%;overflow:hidden}
.gem.sp-h svg,.gem.sp-v svg,.gem.sp-b svg{width:88%;height:88%}
.goal .gem svg,.fly .gem svg{filter:none}
.gr{background:conic-gradient(#ff6f9f,#ffd447,#74cf55,#4fb6f5,#a77cf2,#ff6f9f);border-radius:50%;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-h::after,.sp-v::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 20%,var(--c) 20% 30%);opacity:.55}
.sp-v::after{background:repeating-linear-gradient(90deg,transparent 0 20%,var(--c) 20% 30%)}
.sp-b{box-shadow:inset 0 0 0 3px #fff,inset 0 -3px 0 rgba(0,0,0,.18),0 0 10px 2px rgba(255,240,150,.9);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.9)}}
.tile.sel .gem{transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 12px 3px rgba(255,255,255,.7)}
.tile.hint .gem{animation:wiggle .5s ease-in-out 3}
@keyframes wiggle{25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
.tile.born .gem{animation:born .3s ease-out}
@keyframes born{from{transform:scale(1.6);opacity:.3}}
.combo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:34px;color:#fff;
  text-shadow:0 3px 0 var(--rose),0 0 12px rgba(0,0,0,.3);pointer-events:none;animation:combo 1s ease-out forwards;white-space:nowrap;z-index:5}
@keyframes combo{from{transform:translate(-50%,-30%) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}to{opacity:0;transform:translate(-50%,-90%) scale(1)}}

/* Diyalog ve pencereler */
#dialog{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));cursor:pointer}
#dialog .in{max-width:520px;width:100%;display:flex;gap:10px;align-items:flex-end;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.portrait{width:78px;height:78px;flex:none;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);background:#fff}
.portrait svg{width:100%;height:100%;display:block}
.bubble{flex:1;min-width:0;background:var(--card);border-radius:20px 20px 20px 6px;padding:10px 14px 8px;box-shadow:0 6px 18px rgba(44,42,61,.28)}
.bubble .who{font-family:var(--display);font-weight:800;font-size:16px}
.bubble p{margin:2px 0 4px;line-height:1.45;font-weight:600}
.bubble .next{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
#shade{position:fixed;inset:0;background:rgba(30,40,30,.35);z-index:25}
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(30,40,30,.45)}
#modal .card{background:var(--card);border-radius:24px;padding:20px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .25s ease-out}
#modal h2{font-family:var(--display);font-size:26px;margin:0 0 4px;line-height:1.1;text-wrap:balance}
#modal p{margin:0 0 14px;line-height:1.45;color:#4a4858;font-weight:600}
#modal .btns{display:flex;flex-direction:column;gap:8px}
#modal .btns button{padding:11px;border-radius:14px;font-weight:800;background:#eef1e8}
#modal .btns button.pri{background:var(--rose);color:#fff;box-shadow:0 4px 0 #a82a58}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.opt{border-radius:16px;background:#f1f6ea;padding:10px 4px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.opt .sw{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.big-star{font-size:54px;color:var(--sun);line-height:1;text-shadow:0 3px 0 #c98a12}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;z-index:50;transition:opacity .3s;max-width:90vw;text-align:center}
/* Şeker cilası ve kazanç şovu */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.big,.do,#modal .btns button.pri{position:relative;overflow:hidden}
.big::before,.do::before,#modal .btns button.pri::before{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.big::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.board{background:repeating-linear-gradient(45deg,#ff8db3 0 14px,#fff 14px 28px);box-shadow:0 6px 0 #c23c6c,0 10px 20px rgba(194,60,108,.3)}
.board::before{content:"";position:absolute;inset:4px;border-radius:16px;background:var(--soil)}
.board.shake{animation:shake .35s ease}
.board.shake2{animation:shake2 .5s ease}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
@keyframes shake2{10%{transform:translate(-8px,4px) rotate(-1deg)}30%{transform:translate(8px,-4px) rotate(1deg)}50%{transform:translate(-6px,2px)}70%{transform:translate(5px,-2px)}90%{transform:translate(-2px,1px)}}
.beam{position:absolute;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,#fff 30%,#fff7b0 50%,#fff 70%,transparent);box-shadow:0 0 18px 6px rgba(255,240,150,.9);border-radius:99px;animation:beam .35s ease-out forwards}
.beam.v{background:linear-gradient(0deg,transparent,#fff 30%,#fff7b0 50%,#fff 70%,transparent)}
@keyframes beam{from{opacity:1;transform:scale(1,.2)}40%{transform:scale(1,1)}to{opacity:0;transform:scale(1,1.6)}}
.board.v::after,.v-dummy{}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,220,120,.4) 50%,transparent 75%);z-index:55;pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{to{opacity:0}}
.win .card{background:radial-gradient(circle at 50% 0%,#fff6c2,#fffdf6 60%)!important;border:4px solid #ffd447;box-shadow:0 0 0 4px #ff8db3,0 0 40px 10px rgba(255,212,71,.7),0 10px 30px rgba(0,0,0,.3)!important;position:relative;overflow:hidden}
.win .card::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,212,71,.28) 0 10deg,transparent 10deg 20deg);animation:spin 9s linear infinite;z-index:0}
.win .card>*{position:relative;z-index:1}
.jack{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.01em;background:linear-gradient(#fff36b,#ffb000 55%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #c23c6c) drop-shadow(0 0 10px rgba(255,200,0,.7));animation:jack .9s cubic-bezier(.2,1.6,.4,1) both,throb 1.2s ease-in-out .9s infinite;margin:4px 0 6px}
@keyframes jack{from{transform:scale(0) rotate(-12deg)}}
@keyframes throb{50%{transform:scale(1.07)}}
.score{font-family:var(--display);font-weight:800;font-size:34px;color:var(--rose);font-variant-numeric:tabular-nums;line-height:1}
.score small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bulbs{display:flex;justify-content:center;gap:7px;margin:8px 0 12px}
.bulbs i{width:11px;height:11px;border-radius:50%;background:#ffd447;box-shadow:0 0 8px 2px #ffd447;animation:chase .8s steps(1) infinite}
.bulbs i:nth-child(even){animation-delay:.4s;background:#ff8db3;box-shadow:0 0 8px 2px #ff8db3}
@keyframes chase{50%{opacity:.25}}
.big-star{display:inline-block;animation:jack .8s cubic-bezier(.2,1.6,.4,1) both}
.pill.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.35)}}
body.playing{padding-block:6px}
body.playing #app{gap:8px}
.goal .lv{font-size:12px;color:var(--muted);font-weight:800;margin-left:auto;white-space:nowrap}
.goal.bump .mini{animation:bump .35s ease}
.moves.low{background:var(--rose);animation:throb .8s ease-in-out infinite}
.fly{position:fixed;z-index:58;pointer-events:none;transition:left .55s cubic-bezier(.5,-.3,.7,1),top .55s cubic-bezier(.3,.4,.5,1.2),transform .55s ease;transform:scale(1)}
.fly .gem{inset:0}
.pts{position:absolute;z-index:6;pointer-events:none;font-family:var(--display);font-weight:800;color:#fff;font-size:22px;transform:translate(-50%,-50%);
  text-shadow:0 2px 0 var(--rose),0 0 6px rgba(0,0,0,.35);animation:pts .8s ease-out forwards;white-space:nowrap}
@keyframes pts{from{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}to{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.tile.land .gem{animation:land .28s ease-out}
@keyframes land{40%{transform:scale(1.12,.84) translateY(6%)}75%{transform:scale(.95,1.06)}}
/* Orman arka planı */
body{background:#2e6b3a;min-height:100%}
#forest{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#forest svg{width:100%;height:100%;display:block}
.ff{animation:ff 4s ease-in-out infinite alternate}
@keyframes ff{0%{opacity:.15;transform:translate(0,0)}100%{opacity:1;transform:translate(6px,-10px)}}
.ray{animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{to{opacity:.05}}
#app{position:relative;z-index:1}
.brand{color:#fff;text-shadow:0 2px 0 #1d4d27,0 0 12px rgba(10,40,15,.7)}
.brand small{color:#fff;text-shadow:0 1px 0 #1d4d27,0 0 6px rgba(10,40,15,.8)}
.scene-wrap,.panel{box-shadow:0 0 0 3px #ffd447,0 8px 24px rgba(10,40,15,.45)}
.board{box-shadow:0 6px 0 #c23c6c,0 0 0 3px #ffd447,0 0 26px 6px rgba(255,230,120,.45),0 12px 30px rgba(10,40,15,.5)}
html{overflow-x:hidden}
.bulb-row{position:absolute;inset:1px;pointer-events:none;z-index:3}
.bulb-row i{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff6c2;box-shadow:0 0 6px 2px #ffd447;animation:chase 1s steps(1) infinite}
.bulb-row i:nth-child(3n+1){animation-delay:.33s;background:#ffd1e6;box-shadow:0 0 6px 2px #ff2d95}
.bulb-row i:nth-child(3n+2){animation-delay:.66s;background:#d4f6ff;box-shadow:0 0 6px 2px #00d4ff}
.hud .back,.goals,.pill,.icon-btn{box-shadow:0 0 0 2px #ffd447,0 4px 10px rgba(10,40,15,.35)}
.moves{background:linear-gradient(#2f7d4a,#1d4d27);box-shadow:0 0 0 2px #ffd447,0 0 14px rgba(255,212,71,.6)}
.moves b{color:#ffd447;text-shadow:0 0 8px rgba(255,212,71,.8)}
.goal .lv{color:#8a3c9e}
/* Oyun sırasında tahta ekranı doldurur; yatay ekranda bilgi paneli yana geçer */
body.playing #app{max-width:none}
body.playing .board{--bw:min(100vw,calc(100vh - 78px));--bw:min(100vw,calc(100dvh - 78px));padding:5px}
body.playing .layer{inset:5px}
body.playing .hud{max-width:640px;width:100%;margin:0 auto}
@media (min-aspect-ratio:5/4){
  body.playing #playView:not([hidden]){display:flex;align-items:center;justify-content:center;gap:14px;height:calc(100vh - 12px);height:calc(100dvh - 12px)}
  body.playing .hud{flex-direction:column;width:150px;flex:none;margin:0}
  body.playing .hud .back{padding:10px}
  body.playing .goals{flex-direction:column;align-items:flex-start;padding:10px}
  body.playing .goal .mini{width:34px;height:34px}
  body.playing .goal{font-size:20px}
  body.playing .moves b{font-size:40px}
  body.playing .board{--bw:min(calc(100vw - 200px),calc(100vh - 14px));--bw:min(calc(100vw - 200px),calc(100dvh - 14px));margin:0}
}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:7px;border-radius:12px;background:rgba(255,253,246,.75);font-weight:800;box-shadow:0 0 0 2px #ffd447}
.tabs button.on{background:var(--leaf);color:#fff}

<body>


<div id="forest" aria-hidden="true"></div>
<div id="app">
  <header class="top">
    <div class="brand">Simge'nin Bahçesi<small id="chapterLbl">1. Bölüm · Nevin Nine'nin evi</small></div>
    <div class="pill" title="Yıldızların"><span class="st">★</span><span id="starCount">0</span></div>

  </header>

  <section id="gardenView">

<script>
(()=>{
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);

/* ---------- Kayıt ---------- */
const KEY='simgenin-bahcesi-v1';
let S={level:0,stars:0,done:[],choice:{},intro:false,mute:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- Ses ---------- */
let AC=null;
let adMute=false;
function snd(f=520,d=.1,type='sine',vol=.05){
  if(S.mute||adMute)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const chime=()=>[660,880,1100].forEach((f,i)=>setTimeout(()=>snd(f,.18,'triangle',.06),i*90));
const SFX=(()=>{
  const ok=()=>{if(S.mute||adMute)return false;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return true}catch(e){return false}};
  function tone(f1,f2,d,type,vol,delay=0){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03)}
  function noise(d,vol,ftype,f,delay=0){const t=AC.currentTime+delay,b=AC.createBuffer(1,Math.ceil(AC.sampleRate*d),AC.sampleRate),c=b.getChannelData(0);
    for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/c.length,2);const src=AC.createBufferSource();src.buffer=b;const fl=AC.createBiquadFilter();fl.type=ftype;fl.frequency.value=f;
    const g=AC.createGain();g.gain.value=vol;src.connect(fl).connect(g).connect(AC.destination);src.start(t)}
  const scale=[523,587,659,784,880,1047,1175,1319,1568,1760];
  return{
    pop(n){if(!ok())return;const f=scale[Math.min(n,scale.length-1)];tone(f*1.6,f,.12,'sine',.12);tone(f*2,f*2.4,.06,'triangle',.04);noise(.05,.12,'bandpass',2500)},
    zap(){if(!ok())return;tone(300,2400,.28,'sawtooth',.05);noise(.25,.1,'highpass',3000);tone(1200,1800,.2,'sine',.05,.05)},
    boom(){if(!ok())return;tone(180,40,.5,'sine',.3);noise(.45,.35,'lowpass',900);tone(600,200,.25,'triangle',.06)},
    whoosh(){if(!ok())return;noise(.14,.12,'bandpass',1400);tone(380,520,.08,'sine',.04)},
    nope(){if(!ok())return;tone(260,200,.09,'square',.03);tone(220,170,.1,'square',.03,.1)},
    tick(){if(!ok())return;tone(1500,1700,.04,'triangle',.05)},
    sparkle(){if(!ok())return;[1568,1760,2093,2637].forEach((f,i)=>tone(f,f*1.02,.18,'triangle',.05,i*.06))},
    fanfare(){if(!ok())return;[[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64]].forEach(([f,d])=>{tone(f,f,.3,'square',.035,d);tone(f,f,.35,'triangle',.07,d)});
      [523,659,784,1047].forEach(f=>tone(f,f,1.2,'triangle',.05,.8));noise(.6,.08,'highpass',5000,.8)}
  };
})();
const Music=(()=>{
  let on=false,timer=null,step=0,next=0,master=null;const E=60/104/2,N=n=>440*Math.pow(2,(n-69)/12);
  const chords=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
  const mel=[76,null,79,76, 74,72,null,74, 72,null,69,72, 76,null,null,74, 72,null,74,76, 77,76,74,null, 74,76,79,null, 76,74,72,null];
  function note(t,f,d,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
  let shk=null;
  function sched(){
    while(next<AC.currentTime+.3){
      const bar=Math.floor(step/8)%4,s=step%8,ch=chords[bar];
      if(s===0||s===3||s===4||s===6)ch.forEach((n,i)=>note(next+i*.014,N(n),.32,'triangle',.03));
      if(s===0||s===4)note(next,N(ch[0]-24),.45,'sine',.11);
      if(s===2||s===6)note(next,N(ch[2]-12),.25,'sine',.05);
      const m=mel[step%32];if(m&&Math.floor(step/32)%2===0){note(next,N(m),.3,'triangle',.05);note(next,N(m+12),.18,'sine',.012)}
      else if(m&&step%2===0)note(next,N(m+12),.22,'sine',.03);
      if(s%2===1){const src=AC.createBufferSource();src.buffer=shk;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();g.gain.value=.05;src.connect(f).connect(g).connect(master);src.start(next)}
      step++;next+=E;
    }
  }
  return{start(){if(on||S.mute||adMute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
      if(!shk){shk=AC.createBuffer(1,Math.ceil(AC.sampleRate*.05),AC.sampleRate);const d=shk.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
      master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);on=true;step=0;next=AC.currentTime+.1;timer=setInterval(sched,60)}catch(e){}},
    stop(){on=false;clearInterval(timer);if(master){const m=master;try{m.gain.setTargetAtTime(0,AC.currentTime,.08);setTimeout(()=>m.disconnect(),600)}catch(e){}}}};
})();
/* ---------- Oyun sitesi reklam katmanı ----------
   window.__PLATFORM: 'crazygames' | 'poki' | 'gamedistribution' | yok (artifact ve GitHub sayfası) */
const Ads=(()=>{
  let P=window.__PLATFORM||'none',gdWait=null,gdReward=false;
  const pause=()=>{adMute=true;Music.stop()},resume=()=>{adMute=false;if(!S.mute)Music.start()};
  if(P==='gamedistribution'){window.__gdEvent=e=>{
    if(e.name==='SDK_GAME_PAUSE')pause();
    if(e.name==='SDK_REWARDED_WATCH_COMPLETE')gdReward=true;
    if(e.name==='SDK_GAME_START'){resume();if(gdWait){const w=gdWait;gdWait=null;w()}}}}
  const cg=()=>window.CrazyGames&&window.CrazyGames.SDK;
  async function init(){
    try{
      if(P==='crazygames'){await cg().init();if(cg().environment==='disabled')P='none';
        else{const st=cg().game.settings;if(st&&st.muteAudio){S.mute=true;Music.stop()}
          cg().game.addSettingsChangeListener(n=>{if(n.muteAudio){S.mute=true;Music.stop()}})}}
      else if(P==='poki'){await window.PokiSDK.init().catch(()=>{});window.PokiSDK.gameLoadingFinished()}
    }catch(e){P='none'}
    if(P!=='none'){addEventListener('wheel',e=>e.preventDefault(),{passive:false});
      addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' '].includes(e.key)&&e.target===document.body)e.preventDefault()})}
  }
  const safe=f=>{try{f()}catch(e){}};
  return{
    init,
    get on(){return P!=='none'},
    start(){safe(()=>{if(P==='crazygames')cg().game.gameplayStart();if(P==='poki')PokiSDK.gameplayStart()})},
    stop(){safe(()=>{if(P==='crazygames')cg().game.gameplayStop();if(P==='poki')PokiSDK.gameplayStop()})},
    happy(){safe(()=>{if(P==='crazygames')cg().game.happytime()})},
    midgame(){return new Promise(res=>{const done=()=>{resume();res()};
      try{
        if(P==='crazygames')cg().ad.requestAd('midgame',{adStarted:pause,adFinished:done,adError:done});
        else if(P==='poki')PokiSDK.commercialBreak(pause).then(done,done);
        else if(P==='gamedistribution'&&window.gdsdk&&gdsdk.showAd){gdWait=done;gdsdk.showAd().catch(()=>{gdWait=null;done()});setTimeout(()=>{if(gdWait===done){gdWait=null;done()}},40000)}
        else res();
      }catch(e){done()}})},
    rewarded(){return new Promise(res=>{const fin=ok=>{resume();res(ok)};
      try{
        if(P==='crazygames')cg().ad.requestAd('rewarded',{adStarted:pause,adFinished:()=>fin(true),adError:()=>fin(false)});
        else if(P==='poki')PokiSDK.rewardedBreak({size:'medium',onStart:pause}).then(ok=>fin(!!ok),()=>fin(false));
        else if(P==='gamedistribution'&&window.gdsdk&&gdsdk.showAd){gdReward=false;gdWait=()=>fin(gdReward);gdsdk.showAd('rewarded').catch(()=>{gdWait=null;fin(false)})}
        else res(false);
      }catch(e){fin(false)}})}
  };
})();
Ads.init();
document.addEventListener('pointerdown',()=>Music.start(),{once:true});
document.addEventListener('keydown',()=>Music.start(),{once:true});
$('#muteBtn').onclick=e=>{e.stopPropagation();S.mute=!S.mute;save();$('#muteBtn').style.opacity=S.mute?.45:1;if(S.mute)Music.stop();else{Music.start();SFX.tick()}};
$('#muteBtn').style.opacity=S.mute?.45:1;

/* ---------- Parçacık şovu ---------- */
const FX=(()=>{
  const cv=$('#fx'),cx=cv.getContext('2d');let ps=[],run=false,dpr=1;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
  size();addEventListener('resize',size);
  function loop(){
    cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
    ps=ps.filter(p=>p.life>0);
    for(const p of ps){
      p.life--;p.vy+=p.g;p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      const a=Math.min(1,p.life/p.fade);cx.globalAlpha=a;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      if(p.k==='dot'){cx.fillStyle=p.c;cx.beginPath();cx.arc(0,0,p.s,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(-p.s*.3,-p.s*.3,p.s*.35,0,7);cx.fill()}
      else if(p.k==='conf'){cx.fillStyle=p.c;cx.fillRect(-p.s,-p.s*.45,p.s*2,p.s*.9*Math.abs(Math.cos(p.rot*2)))}
      else if(p.k==='star'){cx.fillStyle=p.c;cx.beginPath();for(let i=0;i<10;i++){const r=i%2?p.s*.45:p.s,an=i*Math.PI/5-Math.PI/2;cx.lineTo(Math.cos(an)*r,Math.sin(an)*r)}cx.fill()}
      else if(p.k==='coin'){const w=Math.abs(Math.cos(p.rot*1.5))*p.s;cx.fillStyle='#e9a10c';cx.beginPath();cx.ellipse(0,0,w+1,p.s+1,0,0,7);cx.fill();cx.fillStyle='#ffd447';cx.beginPath();cx.ellipse(0,0,w,p.s,0,0,7);cx.fill();cx.fillStyle='#fff6c2';cx.fillRect(-w*.2,-p.s*.6,w*.4,p.s*1.2)}
      else if(p.k==='ring'){cx.strokeStyle=p.c;cx.lineWidth=4*a;cx.beginPath();cx.arc(0,0,p.s*(1+(p.max-p.life)/p.max*5),0,7);cx.stroke()}
      cx.restore();
    }
    cx.globalAlpha=1;
    if(ps.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,innerWidth,innerHeight)}
  }
  function add(p){if(reduce)return;const life=p.life||60;ps.push(Object.assign({vx:0,vy:0,g:.25,drag:.98,rot:Math.random()*6,vr:(Math.random()-.5)*.3,s:4,c:'#fff',k:'dot',life,max:life,fade:20},p));if(!run){run=true;requestAnimationFrame(loop)}}
  const R=(a,b)=>a+Math.random()*(b-a);
  return{
    burst(x,y,cols,n=8,pow=5){for(let i=0;i<n;i++){const an=R(0,6.28),v=R(pow*.4,pow);add({x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-2,s:R(2.5,5),c:cols[i%cols.length],k:i%3?'dot':'star',life:R(30,55)|0})}},
    ring(x,y,c='#fff'){add({x,y,k:'ring',c,s:8,g:0,life:24,fade:24})},
    confetti(n=120){const cols=['#ff6f9f','#ffd447','#74cf55','#4fb6f5','#a77cf2','#fff'];for(let i=0;i<n;i++)add({x:R(0,innerWidth),y:R(-innerHeight*.5,-10),vx:R(-1.5,1.5),vy:R(1,4),g:.06,drag:.995,s:R(4,8),c:cols[i%6],k:'conf',vr:R(-.2,.2),life:R(140,240)|0,fade:40})},
    fountain(x,y,n=60){for(let i=0;i<n;i++)add({x,y,vx:R(-7,7),vy:R(-17,-8),g:.45,s:R(6,10),k:i%3?'coin':'star',c:'#ffd447',life:R(70,110)|0,fade:25})},
    get busy(){return ps.length}
  };
})();
const CANDY=[['#ff2d4d','#ff8a9c','#fff'],['#22c03a','#b6ff9a','#fff'],['#1e7bff','#9fd0ff','#fff'],['#ffc400','#fff6b0','#fff'],['#9b3df0','#e2c4ff','#fff']];
function flash(){const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),650)}
function shake(big){const b=$('#board');b.classList.remove('shake','shake2');void b.offsetWidth;b.classList.add(big?'shake2':'shake')}
function countUp(el,to,ms=1200){const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e).toLocaleString('tr-TR');if(k<1){requestAnimationFrame(step);if(Math.random()<.35)snd(900+k*600,.04,'square',.015)}};requestAnimationFrame(step)}

function toast(t,ms=1800){const el=$('#toast');el.textContent=t;el.hidden=false;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.style.opacity=0;setTimeout(()=>el.hidden=true,300)},ms)}

/* ---------- Karakterler ---------- */
const face=(bg,body)=>`<svg viewBox="0 0 60 60"><rect width="60" height="60" fill="${bg}"/>${body}</svg>`;
const eyes=`<circle cx="25" cy="31" r="1.8" fill="#2c2a3d"/><circle cx="35" cy="31" r="1.8" fill="#2c2a3d"/><circle cx="22" cy="36" r="2.4" fill="#ff9fb0" opacity=".6"/><circle cx="38" cy="36" r="2.4" fill="#ff9fb0" opacity=".6"/>`;
const CH={
  simge:{name:'Simge',col:'#e2457a',face:face('#ffdce6',`<path d="M12 40 C9 16 21 8 30 8 C40 8 51 16 48 40 L50 58 L10 58Z" fill="#4a2c22"/><path d="M14 60 C16 47 44 47 46 60Z" fill="#e2457a"/><circle cx="30" cy="30" r="13" fill="#f3c3a0"/><path d="M16 28 C17 16 30 13 43 23 C37 19 26 20 16 28Z" fill="#4a2c22"/>${eyes}<path d="M26 38 Q30 41 34 38" stroke="#8a4a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="43" cy="20" r="3.5" fill="#ffd447"/>`)},
  riza:{name:'Rıza Usta',col:'#4f7a33',face:face('#e3efd4',`<path d="M12 60 C14 46 46 46 48 60Z" fill="#6b8a4a"/><circle cx="30" cy="31" r="13" fill="#e8b48e"/><path d="M15 25 C16 13 44 13 45 25 L48 26 L12 26Z" fill="#6b5a45"/>${eyes}<path d="M22 37 Q30 33 38 37 Q34 41 30 39 Q26 41 22 37Z" fill="#d9d6cf"/><path d="M23 27 L28 28 M32 28 L37 27" stroke="#d9d6cf" stroke-width="2" stroke-linecap="round"/>`)},
  ela:{name:'Ela',col:'#d9711c',face:face('#ffe8cf',`<g fill="#e0732a"><circle cx="17" cy="24" r="8"/><circle cx="24" cy="15" r="8"/><circle cx="36" cy="15" r="8"/><circle cx="43" cy="24" r="8"/><circle cx="15" cy="35" r="7"/><circle cx="45" cy="35" r="7"/></g><path d="M14 60 C16 47 44 47 46 60Z" fill="#3c8fb0"/><circle cx="30" cy="31" r="12.5" fill="#f6cfae"/>${eyes}<circle cx="27" cy="27" r=".1"/><path d="M26 37 Q30 41 34 37" stroke="#8a4a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/><g fill="#c86a3a" opacity=".5"><circle cx="24" cy="34" r=".8"/><circle cx="36" cy="34" r=".8"/></g>`)},
  fistik:{name:'Fıstık',col:'#c9782d',face:face('#fff1d6',`<path d="M14 22 L18 6 L28 18Z M46 22 L42 6 L32 18Z" fill="#e8963f"/><ellipse cx="30" cy="32" rx="18" ry="16" fill="#f0a24c"/><path d="M22 18 q8 6 16 0" stroke="#c9782d" stroke-width="3" fill="none"/><ellipse cx="23" cy="31" rx="2.4" ry="3.2" fill="#2c2a3d"/><ellipse cx="37" cy="31" rx="2.4" ry="3.2" fill="#2c2a3d"/><path d="M28 37 L32 37 L30 39Z" fill="#e2457a"/><path d="M12 36 L22 37 M12 40 L22 39 M48 36 L38 37 M48 40 L38 39" stroke="#fff" stroke-width="1"/><ellipse cx="30" cy="54" rx="14" ry="8" fill="#f0a24c"/>`)},
  saffet:{name:'Saffet Hanım',col:'#7b3fa0',face:face('#efe3fb',`<circle cx="30" cy="12" r="8" fill="#c9c6cf"/><path d="M15 32 C14 18 46 18 45 32Z" fill="#c9c6cf"/><path d="M12 60 C14 46 46 46 48 60Z" fill="#7b3fa0"/><path d="M18 50 Q30 56 42 50 L40 46 Q30 50 20 46Z" fill="#e2457a"/><circle cx="30" cy="31" r="12.5" fill="#efc6a6"/><circle cx="25" cy="31" r="3.6" fill="none" stroke="#5b4636" stroke-width="1.3"/><circle cx="35" cy="31" r="3.6" fill="none" stroke="#5b4636" stroke-width="1.3"/><path d="M28.6 31 h2.8" stroke="#5b4636" stroke-width="1.3"/><circle cx="25" cy="31" r="1.3" fill="#2c2a3d"/><circle cx="35" cy="31" r="1.3" fill="#2c2a3d"/><path d="M26 38 Q30 36.5 34 38" stroke="#8a4a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M21 26 L28 25.5 M32 25.5 L39 26" stroke="#9a96a0" stroke-width="1.6" stroke-linecap="round"/>`)},
  not:{name:'İpucu',col:'#2f7d4a',face:face('#dff1e6',`<path d="M14 46 C14 24 28 12 46 12 C48 32 36 46 14 46Z" fill="#74cf55"/><path d="M17 43 L38 22" stroke="#2f7d4a" stroke-width="2.5" stroke-linecap="round"/>`)},
  mektup:{name:'Nevin Nine\'nin mektubu',col:'#7a4e33',face:face('#f6ead2',`<rect x="10" y="17" width="40" height="28" rx="3" fill="#fffdf6" stroke="#c9a77a" stroke-width="2"/><path d="M10 19 L30 34 L50 19" stroke="#c9a77a" stroke-width="2" fill="none"/><circle cx="30" cy="34" r="5" fill="#e2457a"/>`)}
};
function talk(lines){
  return new Promise(res=>{
    let i=0;const D=$('#dialog'),sh=$('#shade');D.hidden=false;sh.hidden=false;

  for(let x=0;x<W;x++)for(let y=0;y<H;){const c=col(x,y);let e=y+1;if(c>=0)while(e<H&&col(x,e)===c)e++;
    if(c>=0&&e-y>=3)runs.push({d:'v',t:c,cells:Array.from({length:e-y},(_,i)=>(y+i)*W+x)});y=e}
  const groups=[];

    const ng={t:r.t,cells:new Set(r.cells),runs:[r]};
    for(const g of hit){g.cells.forEach(k=>ng.cells.add(k));ng.runs.push(...g.runs);groups.splice(groups.indexOf(g),1)}

  if(g.runs.some(r=>r.d==='h')&&g.runs.some(r=>r.d==='v'))return 'b';

  else if(o.sp==='b'){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=o.x+dx,y=o.y+dy;if(x>=0&&y>=0&&x<W&&y<H)s.push(y*W+x)}}
  else if(o.sp==='r'){const cnt=[0,0,0,0,0];all().forEach(t=>{if(t.t>=0&&t.sp!=='r')cnt[t.t]++});const c=cnt.indexOf(Math.max(...cnt));
    all().forEach(t=>{if(t.t===c&&t.sp!=='r')s.push(t.y*W+t.x)})}
  return s;
}
async function blast(initial,creates=[]){

async function gravity(){

    let n=0;const fresh=[];
    for(let y=wr;y>=0;y--){n++;const o=mk(rnd(5),null,x,-n);G[y][x]=o;fresh.push([o,y])}
    if(fresh.length){void tilesEl.offsetWidth;fresh.forEach(([o,y])=>pos(o,x,y))}
  }
  const moved=all().filter(o=>o.el.style.top!==o._lt);moved.forEach(o=>o._lt=o.el.style.top);

  moved.forEach(o=>{o.el.classList.remove('land');void o.el.offsetWidth;o.el.classList.add('land')});
}
async function resolve(pref){
  for(let guard=0;guard<40;guard++){
    const gs=findGroups();if(!gs.length)break;
    const clear=new Set(),creates=[];
    for(const g of gs){g.cells.forEach(k=>clear.add(k));const sp=specialFor(g);
      if(sp){let k=pref&&pref.find(p=>g.cells.has(p));
        if(k==null){const r=g.runs.reduce((a,b)=>b.cells.length>a.cells.length?b:a);k=r.cells[Math.floor(r.cells.length/2)]}
        creates.push({k,t:g.t,sp})}}
    await blast(clear,creates);pref=null;
    if(guard>=1){combo(PRAISE[Math.min(guard-1,PRAISE.length-1)]);snd(500+guard*120,.15,'triangle',.05);if(guard>=3)FX.confetti(30)}
    await gravity();
  }
}

const PRAISE=['Tatlı!','Şahane!','Nefis!','Şeker patlaması!','İnanılmaz!','Efsane!'];
function combo(t){const d=document.createElement('div');d.className='combo';d.textContent=t;$('#board').appendChild(d);setTimeout(()=>d.remove(),1000)}
function swapG(a,b){const A=G[a.y][a.x],B=G[b.y][b.x];G[a.y][a.x]=B;G[b.y][b.x]=A;pos(A,b.x,b.y);pos(B,a.x,a.y)}
function matchAt(x,y){const c=col(x,y);if(c<0)return false;
  let h=1,i=x-1;while(col(i,y)===c){h++;i--}i=x+1;while(col(i,y)===c){h++;i++}if(h>=3)return true;
  let v=1;i=y-1;while(col(x,i)===c){v++;i--}i=y+1;while(col(x,i)===c){v++;i++}return v>=3}
function findMove(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)for(const[dx,dy]of[[1,0],[0,1]]){
    const x2=x+dx,y2=y+dy;if(x2>=W||y2>=H)continue;const A=G[y][x],B=G[y2][x2];if(!A||!B)continue;
    if(A.sp==='r'||B.sp==='r'||(A.sp&&B.sp))return[A,B];
    G[y][x]=B;G[y2][x2]=A;const B0=[B.x,B.y],A0=[A.x,A.y];A.x=x2;A.y=y2;B.x=x;B.y=y;
    const ok=matchAt(x,y)||matchAt(x2,y2);
    G[y][x]=A;G[y2][x2]=B;A.x=A0[0];A.y=A0[1];B.x=B0[0];B.y=B0[1];
    if(ok)return[A,B];

async function comboFire(A,B){

  const cx=A.x,cy=A.y;A.fired=B.fired=true;
  if(A.sp==='r'&&B.sp==='r'){for(let y=0;y<H;y++)for(let x=0;x<W;x++)add(x,y);combo('Gökkuşağı!')}
  else if(A.sp==='r'||B.sp==='r'){
    const R=A.sp==='r'?A:B,X=R===A?B:A;add(R.x,R.y);add(X.x,X.y);
    const targets=all().filter(o=>o.t===X.t&&o!==X&&o.sp!=='r');
    if(X.sp){X.fired=false;targets.forEach(o=>{o.sp=X.sp==='b'?'b':(Math.random()<.5?'h':'v');draw(o)});snd(900,.3,'triangle');await sleep(380)}
    targets.forEach(o=>add(o.x,o.y));

    if(b===2){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)add(cx+dx,cy+dy)}
    else if(b===1){for(let d=-1;d<=1;d++){for(let i=0;i<8;i++){add(i,cy+d);add(cx+d,i)}}}

async function trySwap(a,b){
  if(busy||!playing||moves<=0)return;
  if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1)return;
  busy=true;clearSel();clearHint();cascadeN=0;
  const A=G[a.y][a.x],B=G[b.y][b.x];
  swapG(a,b);SFX.whoosh();await sleep(170);
  if(A.sp==='r'||B.sp==='r'||(A.sp&&B.sp)){
    moves--;hud();await comboFire(A,B);await gravity();await resolve(null);
  } else if(findGroups().length){
    moves--;hud();await resolve([b.y*W+b.x,a.y*W+a.x]);
  } else {swapG(a,b);SFX.nope();await sleep(180);busy=false;armHint();return}
  if(!findMove())shuffle();
  busy=false;await checkEnd();
}

let down=null;
tilesEl.addEventListener('pointerdown',e=>{
  if(busy||!playing)return;const r=tilesEl.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  if(x<0||y<0||x>=W||y>=H)return;down={x,y,cx:e.clientX,cy:e.clientY,moved:false,cs:r.width/W};
  try{tilesEl.setPointerCapture(e.pointerId)}catch(_){}
});
tilesEl.addEventListener('pointermove',e=>{
  if(!down||down.moved)return;const dx=e.clientX-down.cx,dy=e.clientY-down.cy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<down.cs*.35)return;
  down.moved=true;const t=Math.abs(dx)>Math.abs(dy)?{x:down.x+Math.sign(dx),y:down.y}:{x:down.x,y:down.y+Math.sign(dy)};

  if(sel&&sel.x===d.x&&sel.y===d.y){clearSel();return}

}
